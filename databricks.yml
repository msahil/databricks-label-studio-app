# Asset bundle for Label Studio + Lakebase. For other workspaces: set targets.*.workspace.host,
# variables.profile, and Lakebase variables below. See README "Deploying to another Databricks workspace".
bundle:
  name: label-studio-lakebase

include:
  - resources/*.yml

variables:
  # Resolves ambiguous ~/.databrickscfg entries when multiple profiles share the same host.
  profile:
    default: DEFAULT
  # Lakebase Autoscaling project id (CLI / API name), e.g. msahil-lakebase → projects/msahil-lakebase/branches/...
  # If your project only appears as a UUID in the UI, use: databricks postgres list-projects
  lakebase_project:
    default: "msahil-lakebase"
  lakebase_branch:
    default: "production"
  # Resource id from .../databases/{this} (see resources/label_studio.app.yml)
  lakebase_database_resource_id:
    default: "db-fr9a-1xwzpxyy6h"

targets:
  dev:
    default: true
    mode: development
    workspace:
      profile: ${var.profile}
      host: https://e2-demo-field-eng.cloud.databricks.com
